<a class="card card-hover product-card h-100 text-decoration-none" [routerLink]="['/prodotto', product.sku]">
  <div class="product-card-art">
    <app-product-art [sku]="product.sku" [name]="product.name" [categoryName]="product.category.name" />
  </div>
  <div class="card-body d-flex flex-column gap-1">
    <span class="eyebrow">{{ product.category.name }}</span>
    <span class="card-title h5 mb-0">{{ product.name }}</span>
    <span class="card-text text-body-secondary small">{{ product.yarn }}</span>
    <div class="d-flex align-items-baseline justify-content-between gap-2 mt-auto pt-2">
      <span class="text-price fs-5">{{ product.priceCents / 100 | currency: product.currency }}</span>
      <app-stock-badge [availability]="product.availability" [availableQty]="product.availableQty" />
    </div>
  </div>
</a>
